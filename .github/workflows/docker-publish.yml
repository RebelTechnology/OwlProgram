name: Publish Docker image

# Publishes ghcr.io/<owner>/owlprogram, one image per OWL platform:
#   :owl1 :owl2 :owl3 and :latest (= owl2) on every run,
#   plus :vX.Y.Z-owlN and :vX.Y.Z (= owl2) when run for a version tag.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'HISTORY.md'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Space-separated OWL platforms to build (e.g. "OWL2 OWL3")'
        required: false
        default: 'OWL2 OWL3'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - id: list
        env:
          PLATFORMS: ${{ inputs.platforms || 'OWL1 OWL2 OWL3' }}
        run: echo "matrix=$(jq -nc --arg p "$PLATFORMS" '$p | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          P="${{ matrix.platform }}"
          plc=$(echo "$P" | tr '[:upper:]' '[:lower:]')
          base="${{ env.REGISTRY }}/${IMAGE_NAME,,}"
          tags="${base}:${plc}"
          if [ "$P" = "OWL2" ]; then
            tags="${tags},${base}:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"
            tags="${tags},${base}:${v}-${plc}"
            if [ "$P" = "OWL2" ]; then
              tags="${tags},${base}:${v}"
            fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.platform }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            PLATFORM=${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
